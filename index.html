<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitabım Hangi Rafta?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
<style>
  .ust { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-kare { width: 56px; height: 56px; border-radius: 14px; background: var(--mavi); color: #fff; display: flex; align-items: center; justify-content: center; }
  .logo h1 { font-size: clamp(26px, 4vw, 36px); letter-spacing: -.5px; }
  .logo p { margin: 2px 0 0; color: var(--ikincil); font-size: 17px; }
  .arama { display: flex; gap: 12px; flex-wrap: wrap; background: #fff; border: 1px solid var(--cizgi); border-radius: 20px; padding: 14px; }
  .arama-kutu { flex: 999 1 380px; display: flex; align-items: center; gap: 12px; background: var(--zemin); border-radius: 14px; padding: 0 18px; min-height: 68px; color: var(--ikincil); }
  .arama-kutu input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 24px; color: var(--yazi); outline: none; }
  .arama .dugme { min-height: 68px; font-size: 19px; flex: 1 1 160px; border-radius: 14px; white-space: nowrap; }
  .arama .dugme.cerceve { flex-basis: 250px; }
  .sonuc-alani { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .sonuc-alani > * { flex: 1 1 400px; min-width: 0; }
  .kitap-kart { display: flex; flex-direction: column; gap: 18px; }
  .kitap-kart h2 { font-size: 28px; }
  .kitap-kart .bilgi { margin: 4px 0 0; font-size: 18px; color: #374151; }
  .yer { background: var(--turuncu-acik); border: 2px solid var(--turuncu); border-radius: 16px; padding: 20px 22px; display: flex; align-items: center; gap: 18px; color: #C2410C; }
  .yer p { margin: 0; color: #9A3412; font-weight: 600; font-size: 15px; }
  .yer strong { display: block; font-family: var(--baslik); font-size: clamp(28px, 5vw, 40px); color: var(--turuncu-koyu); line-height: 1.1; }
  .kutucuklar { display: flex; gap: 12px; flex-wrap: wrap; }
  .kutucuk { flex: 1 1 140px; background: var(--zemin); border-radius: 12px; padding: 12px 16px; }
  .kutucuk span { display: block; font-size: 13px; color: var(--ikincil); }
  .kutucuk b { font-size: 21px; }
  .liste { display: flex; flex-direction: column; gap: 10px; }
  .liste button { text-align: left; background: #fff; border: 1px solid var(--cizgi); border-radius: 14px; padding: 14px 16px; font: inherit; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; min-height: 64px; }
  .liste button:hover { border-color: var(--mavi); }
  .liste .kod { font-family: var(--baslik); font-weight: 700; font-size: 20px; color: var(--turuncu-koyu); white-space: nowrap; }
  .bos-durum { text-align: center; padding: 48px 16px; color: var(--ikincil); font-size: 18px; }
  .alt { display: flex; justify-content: flex-end; }
  .alt a { color: var(--ikincil); font-size: 14px; padding: 12px; }
</style>
</head>
<body>
<main class="sayfa">
  <header class="ust">
    <div class="logo">
      <div class="logo-kare" id="logo-ikon"></div>
      <div>
        <h1>Kitabım Hangi Rafta?</h1>
        <p>Kitabın adını yazın ya da barkodunu okutun</p>
      </div>
    </div>
  </header>

  <form class="arama" id="arama-form" role="search">
    <label class="gizli-etiket" for="sorgu">Kitap adı, yazar, yayınevi ya da barkod</label>
    <div class="arama-kutu">
      <span id="ara-ikon"></span>
      <input id="sorgu" type="search" autocomplete="off" placeholder="Örn. 7. sınıf matematik" autofocus>
    </div>
    <button class="dugme ana" type="submit">Ara</button>
    <button class="dugme cerceve" type="button" id="tara"><span id="barkod-ikon"></span>Barkod / QR okut</button>
  </form>

  <section id="sonuc" aria-live="polite"></section>

  <section class="kart" id="sema-kart" hidden>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <h2 style="font-size:22px">Raf şeması</h2>
      <span class="soluk" id="sema-not"></span>
    </div>
    <div class="sema" id="sema"></div>
  </section>

  <footer class="alt"><a href="yonetim.html">Çalışan girişi</a></footer>
</main>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="js/arama.js"></script>
<script src="js/depo.js"></script>
<script src="js/veri.js"></script>
<script src="js/ortak.js"></script>
<script src="js/tarayici.js"></script>
<script src="js/musteri.js"></script>
</body>
</html>
