<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitabım Hangi Rafta?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
<link rel="stylesheet" href="css/kiosk.css">
</head>
<body class="kiosk-govde">
<header class="k-ust">
  <button class="k-marka" type="button" id="ana-sayfa" aria-label="Başlangıç ekranına dön">
    <span class="k-marka-ikon" data-ikon="kitap"></span>
    <span><b id="magaza-adi">Kitabım Hangi Rafta?</b><span>Kitabınızın yerini bulun</span></span>
  </button>
  <div class="k-saat" aria-hidden="true"><b id="saat">--:--</b><span id="tarih"></span></div>
</header>

<main class="k-sayfa">
  <form class="k-arama" id="arama-form" role="search">
    <label class="gizli-etiket" for="sorgu">Kitap adı, yazar, yayınevi ya da barkod</label>
    <div class="k-arama-kutu">
      <span data-ikon="ara"></span>
      <input id="sorgu" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Kitap adı, yazar ya da yayınevi">
      <button class="k-temizle" type="button" id="temizle" aria-label="Aramayı temizle" hidden><span data-ikon="kapat"></span></button>
    </div>
    <button class="dugme ana" type="submit">Ara</button>
    <button class="dugme cerceve" type="button" id="tara"><span data-ikon="barkod"></span>Barkod / QR okut</button>
  </form>

  <!-- Karşılama -->
  <section class="k-karsilama" id="karsilama">
    <div class="k-baslik">
      <h1 id="karsilama-yazi">Aradığınız kitabı birlikte bulalım</h1>
      <p>Kitabın adını yazın ya da arkasındaki barkodu okutun; hangi rafta olduğunu gösterelim.</p>
    </div>
    <div class="k-buyuk-secim">
      <button class="k-secim" type="button" id="secim-yaz"><span class="k-secim-ikon" data-ikon="klavye"></span><span><b>Kitap adı yazın</b><span>Ad, yazar ya da yayınevi</span></span></button>
      <button class="k-secim ikinci" type="button" id="secim-tara"><span class="k-secim-ikon" data-ikon="barkod"></span><span><b>Barkodu okutun</b><span>Kamerayla ya da okuyucuyla</span></span></button>
    </div>
    <div id="okul-kutu" hidden>
      <div class="k-bolum-baslik"><h2>Okul kitap listeleri</h2><span class="soluk">Okulunuzu seçin, listedeki kitaplar raf yerleriyle çıksın</span></div>
      <div class="k-raflar" id="okul-gezin"></div>
    </div>
    <div id="raf-gezin-kutu">
      <div class="k-bolum-baslik"><h2>Raflara göz atın</h2></div>
      <div class="k-raflar" id="raf-gezin"></div>
    </div>
    <div id="yeniler-kutu">
      <div class="k-bolum-baslik"><h2>Yeni gelenler</h2></div>
      <div class="k-yeniler" id="yeniler"></div>
    </div>
  </section>

  <!-- Sonuçlar -->
  <section id="sonuc" aria-live="polite" hidden></section>

  <footer class="k-alt">
    <button type="button" id="tam-ekran">Tam ekran</button>
    <a href="yonetim.html">Personel girişi</a>
  </footer>
</main>

<script src="vendor/supabase.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/ayar.js"></script>
<script src="js/arama.js"></script>
<script src="js/depo.js"></script>
<script src="js/veri.js"></script>
<script src="js/ortak.js"></script>
<script src="js/tarayici.js"></script>
<script src="js/klavye.js"></script>
<script src="js/tema.js"></script>
<script src="js/musteri.js"></script>
</body>
</html>
