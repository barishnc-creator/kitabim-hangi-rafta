name: Testler
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:fonksiyon
      # SQL testleri: runner'da kurulu PostgreSQL'i başlat
      - run: sudo systemctl start postgresql.service && sudo -u postgres createuser -s "$USER" && sudo -u postgres createdb "$USER"
      - run: npm run test:sql
